<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pencatatan Keuangan - Supabase Integrated</title>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ==========================================
       1. VARIABLES & RESET
       ========================================== */
    :root {
      --primary: #06b6d4;        /* Cyan */
      --income: #10b981;         /* Green */
      --expense: #ef4444;        /* Red */
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* Ambient Background Glow */
    .bg-glow {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .glow-blob {
      position: absolute;
      width: 40vw; height: 40vw;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
    }

    .glow-1 { top: -10%; left: -10%; background: var(--primary); }
    .glow-2 { bottom: -10%; right: -10%; background: #6366f1; }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    /* ==========================================
       2. HEADER
       ========================================== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 40%, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--income);
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* ==========================================
       3. SUMMARY CARDS
       ========================================== */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 35px;
    }

    .summary-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .card-icon {
      width: 55px; height: 55px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .icon-balance { background: rgba(6, 182, 212, 0.15); color: var(--primary); }
    .icon-income { background: rgba(16, 185, 129, 0.15); color: var(--income); }
    .icon-expense { background: rgba(239, 68, 68, 0.15); color: var(--expense); }

    .card-info span {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    .card-info h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem;
      color: #fff;
      margin-top: 4px;
    }

    /* ==========================================
       4. CONTENT LAYOUT & FORM
       ========================================== */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1.8fr;
      gap: 25px;
    }

    @media (max-width: 900px) {
      .content-grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 25px;
    }

    .panel h3 {
      font-size: 1.1rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel h3 i { color: var(--primary); }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      padding: 12px 15px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .form-control:focus { border-color: var(--primary); }

    .type-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .type-btn {
      padding: 10px;
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text-muted);
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      text-align: center;
    }

    .type-btn.active-income {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--income);
      color: var(--income);
    }

    .type-btn.active-expense {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--expense);
      color: var(--expense);
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary), #0284c7);
      border: none;
      color: white;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ==========================================
       5. TRANSACTIONS LIST
       ========================================== */
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 380px;
      overflow-y: auto;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 14px;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .item-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-details h4 { font-size: 0.95rem; color: #fff; }
    .item-details span { font-size: 0.75rem; color: var(--text-muted); }

    .amount { font-weight: 700; font-size: 0.95rem; }
    .amount.income { color: var(--income); }
    .amount.expense { color: var(--expense); }

    .delete-btn {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      margin-left: 12px;
    }

    .delete-btn:hover { color: var(--expense); }

    .chart-container {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid var(--card-border);
    }
  </style>
</head>
<body>

  <div class="bg-glow">
    <div class="glow-blob glow-1"></div>
    <div class="glow-blob glow-2"></div>
  </div>

  <div class="container">
    <header>
      <div>
        <h1>Pencatat Keuangan</h1>
        <p>Aplikasi Keuangan Terintegrasi Supabase Database</p>
      </div>
      <div class="status-badge">
        <i class="fa-solid fa-database"></i> Supabase Connected
      </div>
    </header>

    <!-- SUMMARY CARDS -->
    <div class="summary-grid">
      <div class="summary-card">
        <div class="card-icon icon-balance"><i class="fa-solid fa-wallet"></i></div>
        <div class="card-info">
          <span>Total Saldo</span>
          <h2 id="totalBalance">Rp 0</h2>
        </div>
      </div>

      <div class="summary-card">
        <div class="card-icon icon-income"><i class="fa-solid fa-arrow-down-long"></i></div>
        <div class="card-info">
          <span>Total Pemasukan</span>
          <h2 id="totalIncome">Rp 0</h2>
        </div>
      </div>

      <div class="summary-card">
        <div class="card-icon icon-expense"><i class="fa-solid fa-arrow-up-long"></i></div>
        <div class="card-info">
          <span>Total Pengeluaran</span>
          <h2 id="totalExpense">Rp 0</h2>
        </div>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content-grid">
      
      <!-- FORM INPUT -->
      <div class="panel">
        <h3><i class="fa-solid fa-plus-circle"></i> Tambah Transaksi</h3>
        
        <form id="transactionForm" onsubmit="addTransaction(event)">
          
          <div class="type-selector">
            <div class="type-btn active-income" id="typeIncomeBtn" onclick="setType('income')">
              <i class="fa-solid fa-plus"></i> Pemasukan
            </div>
            <div class="type-btn" id="typeExpenseBtn" onclick="setType('expense')">
              <i class="fa-solid fa-minus"></i> Pengeluaran
            </div>
          </div>

          <div class="form-group">
            <label>Jumlah (Rp)</label>
            <input type="number" id="amount" class="form-control" placeholder="Contoh: 50000" required min="1">
          </div>

          <div class="form-group">
            <label>Kategori</label>
            <select id="category" class="form-control" required>
              <option value="Makanan">Makanan & Minuman</option>
              <option value="Gaji">Gaji / Pendapatan</option>
              <option value="Transportasi">Transportasi</option>
              <option value="Belanja">Belanja</option>
              <option value="Hiburan">Hiburan</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>

          <div class="form-group">
            <label>Tanggal</label>
            <input type="date" id="date" class="form-control" required>
          </div>

          <div class="form-group">
            <label>Catatan / Keterangan</label>
            <input type="text" id="description" class="form-control" placeholder="Contoh: Beli Bensin, Makan Siang">
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">Simpan ke Supabase</button>
        </form>
      </div>

      <!-- LIST & CHART -->
      <div class="panel">
        <div class="list-header">
          <h3><i class="fa-solid fa-list-check"></i> Riwayat Transaksi</h3>
          <input type="text" id="searchInput" class="form-control" style="max-width: 200px;" placeholder="Cari..." onkeyup="renderList()">
        </div>

        <div class="transaction-list" id="transactionList">
          <!-- Item list dinamis -->
        </div>

        <div class="chart-container">
          <canvas id="financeChart" height="120"></canvas>
        </div>
      </div>

    </div>
  </div>

  <!-- ==========================================
       JAVASCRIPT LOGIC WITH SUPABASE INTEGRATION
       ========================================== -->
  <script>
    // ⚠️ MASUKKAN CREDENTIAL PROJECT SUPABASE KAMU DI SINI:
    const SUPABASE_URL = "sb_publishable_fCQHCs31hn8giw2fCTNH7w_enwuzfmB";
    const SUPABASE_KEY = "sb_secret_9cYk56QCukMnlSBnYq7R2Q_3LyF9-3j";

    // Inisialisasi Supabase Client
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let transactions = [];
    let currentType = 'income';
    let financeChart = null;

    document.getElementById('date').valueAsDate = new Date();

    function setType(type) {
      currentType = type;
      document.getElementById('typeIncomeBtn').className = type === 'income' ? 'type-btn active-income' : 'type-btn';
      document.getElementById('typeExpenseBtn').className = type === 'expense' ? 'type-btn active-expense' : 'type-btn';
    }

    function formatRupiah(number) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0
      }).format(number);
    }

    // 1. FETCH DATA DARI SUPABASE
    async function fetchTransactions() {
      const { data, error } = await supabaseClient
        .from('transactions')
        .select('*')
        .order('date', { ascending: false });

      if (error) {
        console.error('Error fetching data:', error);
        return;
      }

      transactions = data;
      updateUI();
    }

    // 2. INSERT TRANSAKSI BARU KE SUPABASE
    async function addTransaction(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = "Menyimpan...";
      submitBtn.disabled = true;

      const amount = parseFloat(document.getElementById('amount').value);
      const category = document.getElementById('category').value;
      const date = document.getElementById('date').value;
      const description = document.getElementById('description').value || category;

      const { data, error } = await supabaseClient
        .from('transactions')
        .insert([
          { type: currentType, amount, category, date, description }
        ]);

      if (error) {
        alert('Gagal menyimpan data: ' + error.message);
      } else {
        document.getElementById('amount').value = '';
        document.getElementById('description').value = '';
        await fetchTransactions();
      }

      submitBtn.innerText = "Simpan ke Supabase";
      submitBtn.disabled = false;
    }

    // 3. DELETE TRANSAKSI DARI SUPABASE
    async function deleteTransaction(id) {
      if (!confirm("Hapus transaksi ini?")) return;

      const { error } = await supabaseClient
        .from('transactions')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Gagal menghapus: ' + error.message);
      } else {
        fetchTransactions();
      }
    }

    // UPDATE UI
    function updateUI() {
      renderList();
      updateSummary();
      updateChart();
    }

    function updateSummary() {
      let income = 0;
      let expense = 0;

      transactions.forEach(t => {
        if (t.type === 'income') income += Number(t.amount);
        else expense += Number(t.amount);
      });

      document.getElementById('totalBalance').innerText = formatRupiah(income - expense);
      document.getElementById('totalIncome').innerText = formatRupiah(income);
      document.getElementById('totalExpense').innerText = formatRupiah(expense);
    }

    function renderList() {
      const list = document.getElementById('transactionList');
      const search = document.getElementById('searchInput').value.toLowerCase();
      list.innerHTML = '';

      const filtered = transactions.filter(t => 
        t.description.toLowerCase().includes(search) || 
        t.category.toLowerCase().includes(search)
      );

      if (filtered.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted);">Tidak ada transaksi.</div>`;
        return;
      }

      filtered.forEach(t => {
        const item = document.createElement('div');
        item.className = 'item';
        const isIncome = t.type === 'income';

        item.innerHTML = `
          <div class="item-left">
            <div class="item-icon" style="background: ${isIncome ? 'rgba(16, 185, 129, 0.15)' : 'rgba(239, 68, 68, 0.15)'}; color: ${isIncome ? 'var(--income)' : 'var(--expense)'};">
              <i class="fa-solid ${isIncome ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
            </div>
            <div class="item-details">
              <h4>${t.description}</h4>
              <span>${t.category} • ${t.date}</span>
            </div>
          </div>
          <div>
            <span class="amount ${t.type}">${isIncome ? '+' : '-'} ${formatRupiah(t.amount)}</span>
            <button class="delete-btn" onclick="deleteTransaction(${t.id})"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        `;

        list.appendChild(item);
      });
    }

    function updateChart() {
      let income = 0;
      let expense = 0;

      transactions.forEach(t => {
        if (t.type === 'income') income += Number(t.amount);
        else expense += Number(t.amount);
      });

      const ctx = document.getElementById('financeChart').getContext('2d');
      if (financeChart) financeChart.destroy();

      financeChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Pemasukan', 'Pengeluaran'],
          datasets: [{
            data: [income, expense],
            backgroundColor: ['rgba(16, 185, 129, 0.6)', 'rgba(239, 68, 68, 0.6)'],
            borderColor: ['#10b981', '#ef4444'],
            borderWidth: 1.5,
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255, 255, 255, 0.05)' } },
            x: { ticks: { color: '#94a3b8' }, grid: { display: false } }
          }
        }
      });
    }

    // INITIAL LOAD
    fetchTransactions();
  </script>
</body>
</html>
